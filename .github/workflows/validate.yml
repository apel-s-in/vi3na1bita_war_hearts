name: Validate War Hearts

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validate ESM syntax
        run: |
          while IFS= read -r file; do
            echo "CHECK $file"
            node --input-type=module --check < "$file"
          done < <(find src -type f -name '*.js' | sort)

      - name: Validate sandbox storage boundary
        run: |
          if grep -REn "localStorage|sessionStorage|indexedDB" src; then
            echo "Persistent browser storage found inside War Hearts"
            exit 2
          fi

      - name: Validate parent-mediated transport
        run: |
          if grep -REn "X-Vi3-Session|X-Yandex-OAuth|clientSecret|FriendsCore" src; then
            echo "Private parent authentication or direct FriendsCore access found"
            exit 2
          fi

          grep -q "GC_SAVE_DATA" src/game/match-persistence.js
          grep -q "GC_SAVE_DATA" src/screens/field.js

          grep -q "ranked_match_prepare" ../vi3na1bita-games/common/network-bridge.js 2>/dev/null || true
          grep -q "prepareRankedMatch" src/game/ranked-v2.js
          grep -q "prepareRankedStake" src/net/war-hearts-session.js
          grep -q "isRankedTerminal" src/game/match-persistence.js
          grep -q "isRankedEconomyFinal" src/game/match-persistence.js
          grep -q "transcriptHash" src/game/ranked-v2.js
          grep -q "waitForRankedSettlement" src/game/ranked-v2.js
          grep -q "getRankedMatchStatus" src/game/ranked-v2.js
          grep -q "recordRankedShot" src/game/network-combat.js
          grep -q "crypto.randomUUID" src/game/network-combat.js

          if grep -REn '\bcreateTranscript\b|\bTURN_STATE\b|\bRPS_CHOICE\b' src; then
            echo "Legacy transcript or open P2P RPS found"
            exit 2
          fi

          grep -q "playRankedRps" src/game/ranked-v2.js
          grep -q "commitRankedRps" src/net/war-hearts-session.js
          grep -q "revealRankedRps" src/net/war-hearts-session.js
